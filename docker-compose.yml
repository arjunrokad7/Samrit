services:
  # INFRASTRUCTURE (DB & Cache)
  postgres:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${APP_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    command: redis-server --appendonly yes

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  # BACKEND (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      TZ: ${APP_TIMEZONE:-America/New_York}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Mount volume for Hot Reloading
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - ./shared:/app/shared
      - ./scripts:/app/scripts:ro
      - ./database:/app/database:ro
      - private_documents:/app/backend/private_documents
      - custody_photos:/app/backend/uploads

  # FRONTEND (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_APP_CITY: ${VITE_APP_CITY:-New York City}
      VITE_APP_LOCALE: ${VITE_APP_LOCALE:-en-US}
      VITE_APP_TIMEZONE: ${VITE_APP_TIMEZONE:-America/New_York}
      VITE_DEFAULT_LATITUDE: ${VITE_DEFAULT_LATITUDE:-40.7306}
      VITE_DEFAULT_LONGITUDE: ${VITE_DEFAULT_LONGITUDE:--73.9866}
      VITE_DISTANCE_UNIT: mi
      VITE_TEMPERATURE_UNIT: F
      VITE_CURRENCY: USD
      TZ: ${APP_TIMEZONE:-America/New_York}
    depends_on:
      - backend
    command: npm run dev -- --host
    # Mount volume for Hot Reloading
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - ./shared:/app/shared

volumes:
  postgres_data:
  private_documents:
  custody_photos:
